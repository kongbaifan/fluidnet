# 门禁：倍思鹿参考模块包（modules/）+ 项目控制脚本模板（examples/control_templates/）
# 这些测试只依赖 pydantic / pytest / ruff，不需要 scipy 或 CoolProp：
#   - 模块包验证到 L1 契约 + L2 逻辑（InProcessModuleRunner）
#   - 控制模板用 ControlRunner 直接执行
# 完整的 L3 联网测试由主 ci.yml 的 backend job（全量依赖）覆盖，这里只做快速反馈。
name: bsl-modules

on:
  push:
    branches: [master]
    paths:
      - 'fluidnet-prototype-engine/modules/**'
      - 'fluidnet-prototype-engine/examples/control_templates/**'
      - 'fluidnet-prototype-engine/tests/test_bsl_modules*.py'
      - 'fluidnet-prototype-engine/tests/test_control_templates.py'
      - 'fluidnet-prototype-engine/scripts/extract_baselu_cases.py'
      - '.github/workflows/bsl-modules.yml'
  pull_request:
    paths:
      - 'fluidnet-prototype-engine/modules/**'
      - 'fluidnet-prototype-engine/examples/control_templates/**'
      - 'fluidnet-prototype-engine/tests/test_bsl_modules*.py'
      - 'fluidnet-prototype-engine/tests/test_control_templates.py'
      - 'fluidnet-prototype-engine/scripts/extract_baselu_cases.py'
      - '.github/workflows/bsl-modules.yml'

env:
  PYTHONUTF8: '1'

concurrency:
  group: bsl-modules-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: bsl modules (Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 版本与 pyproject.toml / requirements-dev.txt 的锁定保持一致，避免小版本漂移。
      - name: 安装测试依赖
        run: |
          python -m pip install --disable-pip-version-check pydantic==2.13.4 pytest==8.4.1 ruff==0.16.0
      - name: ruff lint（模块 + 控制模板 + 测试 + 提取脚本）
        run: |
          python -m ruff check modules examples/control_templates tests/test_bsl_modules.py tests/test_bsl_modules_p1.py tests/test_bsl_modules_p2.py tests/test_control_templates.py scripts/extract_baselu_cases.py
      - name: 模块与控制模板回归
        run: |
          python -m pytest -q tests/test_bsl_modules.py tests/test_bsl_modules_p1.py tests/test_bsl_modules_p2.py tests/test_control_templates.py

  package:
    name: package module kit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # 每次门禁通过都产出一份可下载的模块包与文档；发布/归档流程按此 artifact 取件。
      - uses: actions/upload-artifact@v4
        with:
          name: bsl-module-kit
          if-no-files-found: error
          path: |
            fluidnet-prototype-engine/modules
            fluidnet-prototype-engine/examples/control_templates
            fluidnet-prototype-engine/docs/MODULE_KIT.md
            fluidnet-prototype-engine/docs/MODULES_P0.md
            fluidnet-prototype-engine/docs/MODULES_P1.md
            fluidnet-prototype-engine/docs/MODULES_P2.md
            fluidnet-prototype-engine/docs/BSL_MODULE_MAP.md
            fluidnet-prototype-engine/docs/BASELU_REFERENCE_CASES.md
            fluidnet-prototype-engine/tests/test_bsl_modules.py
            fluidnet-prototype-engine/tests/test_bsl_modules_p1.py
            fluidnet-prototype-engine/tests/test_bsl_modules_p2.py
            fluidnet-prototype-engine/tests/test_control_templates.py
            fluidnet-prototype-engine/tests/fixtures/baselu
