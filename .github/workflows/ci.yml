# CI 门禁：后端引擎（ruff + mypy advisory + pytest/覆盖率 + 契约一致性）与前端（语法检查 + 浏览器冒烟）。
# 仓库根只是外壳，实际工程在 fluidnet-prototype-engine/ 下，所有命令统一在该目录执行。
name: ci

on:
  push:
    branches: [master]
  pull_request:

# feature 分支只由 pull_request 触发；master 只由 push 触发，避免同一提交出现两套
# 并发运行（重复的浏览器冒烟会争抢 runner，且 cancelled 检查会污染合并状态）。
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Windows 控制台默认代码页不是 UTF-8，统一开启 UTF-8 模式，避免中文断言/跳过原因输出报编码错。
env:
  PYTHONUTF8: '1'

jobs:
  backend:
    name: backend (Python 3.11)
    runs-on: windows-latest
    # 全量测试 + 覆盖率统计比纯 pytest 慢，留足余量（本机实测约 7 分钟，CI 更慢）。
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # requirements-dev.txt 通过 `-r requirements.txt` 带入运行/测试依赖，
      # 而 requirements.txt 首行的 `-e .` 会按当前目录做可编辑安装，因此一步即可完成。
      - name: 安装后端依赖（含 ruff/mypy/pytest-cov）
        run: |
          python -m pip install -r requirements-dev.txt
      # 阻塞门禁：pyflakes + 语法错误，规则集见 ruff.toml。
      - name: ruff lint
        run: python -m ruff check backend tests scripts modules examples/control_templates
      # 类型检查目前为 advisory（宽松模式，基线 40 errors / 10 files，见 mypy.ini），
      # 不阻塞合并；后续按模块收紧后再改为阻塞门禁。
      - name: mypy（advisory，暂不阻塞）
        continue-on-error: true
        run: python -m mypy
      # 覆盖率 floor 配置在 pyproject.toml [tool.coverage.report].fail_under，
      # 低于 floor 时 pytest 以非零退出码失败。
      - name: 后端测试 + 覆盖率
        run: python -m pytest -q --cov=fn_engine --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: fluidnet-prototype-engine/coverage.xml
          if-no-files-found: ignore
      # 由 generate_contracts.py --check 比对 contracts/ 与可执行模型是否一致。
      - name: 契约一致性检查
        run: python scripts/generate_contracts.py --check

  frontend:
    name: frontend (Node 24 + Edge)
    runs-on: windows-latest
    # npm ci 会顺带安装 Playwright 浏览器（几分钟），job 上限留宽一点，浏览器测试步骤单独限 20 分钟。
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      # 浏览器脚本用 tests/browser-server.mjs 启动 `python -m fn_engine serve`，所以前端 job 也要装后端依赖。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装后端依赖（供浏览器测试启动引擎）
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluidnet-prototype-engine/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      # 前端门禁使用 `node --check` 语法检查（npm run check）。
      # 暂不引入 eslint：新增 devDependency 必须同步 package-lock.json 才能保证 npm ci 可装，
      # 当前以语法检查为前端质量门禁，eslint 待后续单独 PR 引入。
      - name: 前端语法检查
        run: npm run check
      # windows-latest 自带 Edge，浏览器脚本用 chromium.launch({channel:'msedge',headless:true}) 无头运行。
      # 逐个运行脚本：清单从 package.json 的 test:browser 解析，保持单一来源。
      # 失败脚本先记 ::warning::（可见于 CI 注解，便于定位偶发 flake），单次重试；
      # 两次都失败才终止，避免慢速 runner 的一次超时把整个前端门禁判红。
      - name: 浏览器冒烟测试
        timeout-minutes: 25
        shell: pwsh
        run: |
          $command = (Get-Content package.json -Raw | ConvertFrom-Json).scripts.'test:browser'
          $scripts = $command -split '&&' | ForEach-Object { ($_ -replace '^\s*node\s+', '').Trim() }
          foreach ($script in $scripts) {
            Write-Host "::group::$script"
            node $script
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::$script failed on first attempt; retrying once (CI runner flake mitigation)"
              node $script
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::endgroup::"
              throw "$script failed twice"
            }
            Write-Host "::endgroup::"
          }
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: fluidnet-prototype-engine/artifacts/
          if-no-files-found: ignore
