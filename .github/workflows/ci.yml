# CI 门禁：后端引擎（pytest + 契约一致性）与前端（语法检查 + 浏览器冒烟）。
# 仓库根只是外壳，实际工程在 fluidnet-prototype-engine/ 下，所有命令统一在该目录执行。
name: ci

on:
  push:
  pull_request:

# Windows 控制台默认代码页不是 UTF-8，统一开启 UTF-8 模式，避免中文断言/跳过原因输出报编码错。
env:
  PYTHONUTF8: '1'

jobs:
  backend:
    name: backend (Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # requirements.txt 内含 `-e .`，pip 按当前目录解析本地路径，因此这里必须在工程目录内执行。
      - name: 安装后端依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: 后端测试
        run: python -m pytest -q
      # 由 generate_contracts.py --check 比对 contracts/ 与可执行模型是否一致。
      - name: 契约一致性检查
        run: python scripts/generate_contracts.py --check

  frontend:
    name: frontend (Node 24 + Edge)
    runs-on: windows-latest
    # npm ci 会顺带安装 Playwright 浏览器（几分钟），job 上限留宽一点，浏览器测试步骤单独限 20 分钟。
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      # 浏览器脚本用 tests/browser-server.mjs 启动 `python -m fn_engine serve`，所以前端 job 也要装后端依赖。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装后端依赖（供浏览器测试启动引擎）
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluidnet-prototype-engine/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 前端语法检查
        run: npm run check
      # windows-latest 自带 Edge，浏览器脚本用 chromium.launch({channel:'msedge',headless:true}) 无头运行。
      - name: 浏览器冒烟测试
        timeout-minutes: 20
        run: npm run test:browser
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: fluidnet-prototype-engine/artifacts/
          if-no-files-found: ignore
