# 日常门禁：静态/合同/固定事务核心、受影响后端专项和代表性浏览器。
# 完整覆盖率、跨BLAS矩阵及全部登记浏览器调用保留在手动 ci-full.yml。
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-quick-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  module-sdk:
    name: module SDK (Python 3.11, strict)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SDK 轻依赖（无需安装引擎）
        run: python -m pip install pytest==8.4.1 pytest-cov==7.1.0 mypy==2.3.0 ruff==0.16.0
      - name: SDK 与示例严格类型门
        run: python -m mypy --config-file mypy-sdk.ini
      - name: SDK lint
        run: python -m ruff check backend/fn_sdk examples/module_sdk tests/test_module_sdk.py tests/test_module_sdk_hydraulics.py tests/test_module_sdk_thermal.py
      - name: SDK 独立测试与覆盖率
        env:
          COVERAGE_FILE: artifacts/module-sdk.coverage
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest -q tests/test_module_sdk.py tests/test_module_sdk_hydraulics.py tests/test_module_sdk_thermal.py --cov=fn_sdk --cov-report=term-missing --cov-report=xml:artifacts/module-sdk-coverage.xml
      - name: SDK 覆盖率证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-sdk-coverage
          path: fluidnet-prototype-engine/artifacts/module-sdk-coverage.xml
          if-no-files-found: ignore

  frontend-checks:
    name: frontend static and unit checks
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.quick-plan.outputs.matrix }}
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluidnet-prototype-engine/package-lock.json
      - run: npm ci
      - name: 前端语法检查
        run: npm run check
      - name: 前端轻量单元检查
        run: npm run test:ui
      - name: 核验清单并生成日常范围
        id: quick-plan
        shell: pwsh
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/ci-quick.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Quick manifest validation failed' }
          if ($env:IMPACT_BASE -and $env:IMPACT_HEAD -and $env:IMPACT_BASE -notmatch '^0+$') {
            $browserMatrix = node scripts/ci-quick.mjs --base $env:IMPACT_BASE --head $env:IMPACT_HEAD --matrix --output artifacts/ci-quick-plan.json
          } else {
            $browserMatrix = node scripts/ci-quick.mjs --matrix --output artifacts/ci-quick-plan.json
          }
          if ($LASTEXITCODE -ne 0) { throw 'Quick plan generation failed' }
          "matrix=$browserMatrix" >> $env:GITHUB_OUTPUT
          'Daily quick scope only. Full coverage is available through manual ci-full.yml.' >> $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/ci-quick-plan.json >> $env:GITHUB_STEP_SUMMARY
      - name: 上传实际选取与延后范围
        uses: actions/upload-artifact@v4
        with:
          name: ci-quick-plan
          path: fluidnet-prototype-engine/artifacts/ci-quick-plan.json
          if-no-files-found: error

  backend:
    name: backend quick (Python 3.11)
    needs: frontend-checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ci-quick-plan
          path: fluidnet-prototype-engine/artifacts
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff lint
        run: python -m ruff check backend tests scripts modules examples/control_templates
      - name: mypy 类型检查
        run: python -m mypy
      - name: 公共会话接口严格类型检查
        run: python -m mypy --config-file mypy-session.ini
      - name: 模块执行器接口严格类型检查
        run: python -m mypy --config-file mypy-runner.ini
      - name: 固定接受事务与受影响专项
        run: node scripts/ci-quick.mjs --run-backend --plan artifacts/ci-quick-plan.json
      - name: 契约与生成物只读检查
        run: python scripts/generated_artifacts.py --verify
      - name: 生成物语义审查摘要
        if: always()
        env:
          GENERATED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if (-not $env:GENERATED_BASE -or $env:GENERATED_BASE -match '^0+$') { $env:GENERATED_BASE = 'HEAD' }
          python scripts/generated_artifacts.py --base $env:GENERATED_BASE --json | Out-File -Encoding utf8 artifacts/generated-review.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-artifact-review
          path: fluidnet-prototype-engine/artifacts/generated-review.json
          if-no-files-found: error

  browser:
    name: browser quick (${{ matrix.group }})
    needs: frontend-checks
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.frontend-checks.outputs.matrix) }}
    defaults:
      run:
        working-directory: fluidnet-prototype-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluidnet-prototype-engine/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-quick-plan
          path: fluidnet-prototype-engine/artifacts
      - name: 执行选中的代表流程
        run: node scripts/ci-quick.mjs --run-browser --plan artifacts/ci-quick-plan.json --group ${{ matrix.group }} --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quick-${{ matrix.group }}
          path: fluidnet-prototype-engine/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend (Node 24 + Edge)
    needs: [frontend-checks, browser]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: 汇总日常前端检查
        shell: pwsh
        env:
          STATIC_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if ($env:STATIC_RESULT -ne 'success' -or $env:BROWSER_RESULT -ne 'success') {
            throw "Frontend quick scope failed: static=$env:STATIC_RESULT browser=$env:BROWSER_RESULT"
          }
          'Frontend quick scope passed; complete browser coverage was not run.' >> $env:GITHUB_STEP_SUMMARY

  quick-gate:
    name: ci quick
    needs: [module-sdk, backend, frontend]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: 汇总日常门禁
        shell: pwsh
        env:
          SDK_RESULT: ${{ needs.module-sdk.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if ($env:SDK_RESULT -ne 'success' -or $env:BACKEND_RESULT -ne 'success' -or $env:FRONTEND_RESULT -ne 'success') {
            throw "Quick checks failed: sdk=$env:SDK_RESULT backend=$env:BACKEND_RESULT frontend=$env:FRONTEND_RESULT"
          }
          'Daily scoped checks passed. No full-engine coverage claim. Run ci-full manually for full regression.' >> $env:GITHUB_STEP_SUMMARY
