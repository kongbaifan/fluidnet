# Strict public session boundaries; legacy domain implementations remain gradually typed.
[mypy]
python_version = 3.11
files = backend/fn_engine/session_base.py, backend/fn_engine/sessions.py
mypy_path = backend
strict = True
follow_imports = silent
ignore_missing_imports = True
# Calls into the existing compiler and Worker implementations remain untyped.
disallow_untyped_calls = False
