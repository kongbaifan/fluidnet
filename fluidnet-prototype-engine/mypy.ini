# mypy config: blocking, gradually typed backend/fn_engine checks.
#
# NOTE: keep this file ASCII-only. Python's configparser reads mypy.ini with the
# platform default encoding (GBK on zh-CN Windows), so non-ASCII comments crash
# mypy before type checking even starts.
#
# Rationale: the prototype code base uses many untyped functions and dynamic
# structures (Pydantic/JSON), so strict mode would report mostly runtime-noise.
# CI blocks on errors in this scope. Untyped bodies are still excluded;
# tighten that coverage module by module separately from the zero-error gate.
#
# Baseline: zero errors (2026-10-25, mypy 2.3.0, CPython 3.11.0).
[mypy]
python_version = 3.11
files = backend/fn_engine
ignore_missing_imports = True
check_untyped_defs = False
disallow_untyped_defs = False
warn_unused_configs = True
warn_redundant_casts = False
