# mypy config: loose/advisory mode for backend/fn_engine.
#
# NOTE: keep this file ASCII-only. Python's configparser reads mypy.ini with the
# platform default encoding (GBK on zh-CN Windows), so non-ASCII comments crash
# mypy before type checking even starts.
#
# Rationale: the prototype code base uses many untyped functions and dynamic
# structures (Pydantic/JSON), so strict mode would report mostly runtime-noise.
# We establish a runnable baseline first; CI runs this step with
# continue-on-error (advisory, non-blocking) and we tighten it module by module.
#
# Current baseline: 40 errors in 10 files (2026-10-18, mypy 2.3.0, CPython 3.11.0).
[mypy]
python_version = 3.11
files = backend/fn_engine
ignore_missing_imports = True
check_untyped_defs = False
disallow_untyped_defs = False
warn_unused_configs = True
warn_redundant_casts = False
