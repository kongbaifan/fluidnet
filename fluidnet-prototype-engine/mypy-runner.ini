# Strict shared runner boundary; no runtime import of the conformance fixture.
[mypy]
python_version = 3.11
files = backend/fn_engine/runner_protocol.py, backend/fn_engine/runner_typing.py, backend/fn_engine/module_transactions.py
mypy_path = backend
strict = True
follow_imports = silent
ignore_missing_imports = True
disallow_untyped_calls = False
