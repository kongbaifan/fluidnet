[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidnet-prototype-engine"
version = "0.5.0"
description = "Prototype-aligned declarative fluid network engine"
license = {text = "MIT"}
requires-python = ">=3.11"
# 运行依赖全部锁定到本机实测版本，避免本机/CI 解析出不同小版本导致行为漂移。
# 实测环境：Windows + CPython 3.11.0。
dependencies = [
  "fastapi==0.137.1",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "CoolProp==8.0.0",
  "numpy==2.3.2",
  "scipy==1.17.1"
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "numerics_fast: 数值优化的快速验收子集（CI 只跑这些；完整矩阵由固定环境基线脚本执行）",
]

[tool.coverage.run]
source = ["fn_engine"]
branch = false

[tool.coverage.report]
# 覆盖率基线（`python -m pytest --cov=fn_engine`）：
#  2026-10-18（引入门禁）：374 passed，TOTAL 88.50%
#  2026-10-20（冷库 A1）：390 passed，TOTAL 88.7%
#  2026-10-22（v0.5.0，A/B 案例 + 模块套件）：532 passed，TOTAL 90.77%（7617 statements / 703 missed）
# floor 取 85%，低于当前基线约 5.8 个百分点，防止后续改动回退；未覆盖行由 term-missing 持续跟踪。
show_missing = true
skip_covered = false
fail_under = 85
