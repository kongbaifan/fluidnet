  <script>
    (() => {
      const root=document.getElementById('fluidnet-floating-workbench');
      const desktop=root.querySelector('.fn-desktop');
      const canvas=root.querySelector('.fn-canvas');
      const layer=root.querySelector('.fn-windows');
      const nodeLayer=root.querySelector('.fn-devices');
      const context=root.querySelector('.fn-context');
      const svgNS='http://www.w3.org/2000/svg';
      const kinds={
        pump:{name:'循环泵',icon:'fan',code:'P'},valve:{name:'调节阀',icon:'sliders-horizontal',code:'V'},
        pipe:{name:'管道',icon:'move-horizontal',code:'L'},source:{name:'压力边界',icon:'cylinder',code:'B'},
        tank:{name:'开式水箱',icon:'container',code:'T'},exchanger:{name:'换热机组',icon:'arrow-left-right',code:'HX'}
      };
      const originals=[
        {id:'source',code:'B-01',name:'供水边界',kind:'source'},
        {id:'pump',code:'P-01',name:'循环泵',kind:'pump'},
        {id:'valve_a',code:'V-01',name:'A 路调节阀',kind:'valve'},
        {id:'pipe_a',code:'L-01',name:'A 路管道',kind:'pipe'},
        {id:'valve_b',code:'V-02',name:'B 路调节阀',kind:'valve'},
        {id:'pipe_b',code:'L-02',name:'B 路管道',kind:'pipe'},
        {id:'sink',code:'B-02',name:'回水边界',kind:'source'}
      ];
      const defaults={speed:1,efficiency:75,openingA:80,kvA:16,openingB:55,kvB:16,pressure:201.325,temperature:20,sinkPressure:201.325,sinkTemperature:20,lengthA:30,diameterA:40,lengthB:40,diameterB:40};
      const state={version:2,selected:'pump',time:12,running:false,mode:'paused',runtime:{...defaults},library:{...defaults},windows:{},order:[],extras:[],positions:{},dirty:false,libraryCollapsed:false,readings:{q:3.55,qa:3.55*80/135,qb:3.55*55/135},history:[],series:{total:true,a:true,b:true}};
      for(let t=0;t<=12;t+=.5){const q=3.55-.48*Math.exp(-t/2.4);state.history.push({t,q,qa:q*80/135,qb:q*55/135});}
      const design={libraryWidth:144,compact:true,showValues:true};
      const nodes=new Map(originals.map(n=>[n.id,{...n}]));
      const panels=new Map();
      let timer=null,toastTimer=null,placing=null,pointer=null,contextId=null,scheduled=0;
      const small=()=>root.clientWidth<=700;
      const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const finite=(n,fallback)=>Number.isFinite(Number(n))?Number(n):fallback;
      const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
      const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
      function icons(){if(globalThis.lucide&&root.querySelector('i[data-lucide]')){root.querySelectorAll('svg[data-lucide]').forEach(el=>el.removeAttribute('data-lucide'));globalThis.lucide.createIcons({attrs:{width:16,height:16}});root.querySelectorAll('svg[data-lucide]').forEach(el=>el.removeAttribute('data-lucide'));}}
      function announce(text){root.querySelector('#fn-announcement').textContent=text;}
      function notify(text){const toast=root.querySelector('.fn-toast');toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},2600);announce(text);}
      function snapshot(){return {version:2,selected:state.selected,time:state.time,runtime:{...state.runtime},library:{...state.library},windows:JSON.parse(JSON.stringify(state.windows)),order:[...state.order],extras:state.extras.map(n=>({...n})),positions:{...state.positions},readings:{...state.readings},history:state.history.slice(-45),series:{...state.series},libraryCollapsed:state.libraryCollapsed,design:{...design}};}
      function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'浮动设备窗口',selectedDevice:nodes.get(state.selected)?.code||state.selected,openWindows:state.order.filter(id=>state.windows[id]?.open),parameters:{pumpSpeed:state.runtime.speed,valveAOpening:state.runtime.openingA,valveBOpening:state.runtime.openingB}},privateContent:snapshot()}).catch(()=>{});}
      function fields(node){
        const id=node.id,extra=!!node.extra;
        const field=(key,label,unit,min,max,step,value,digits=2)=>({key:extra?id+'_'+key:key,label,unit,min,max,step,value,digits});
        if(node.kind==='pump')return [field('speed','转速比','倍',.2,1.3,.05,1,2),field('efficiency','泵效率','%',1,100,1,75,1)];
        if(node.kind==='valve')return [field(id==='valve_b'?'openingB':'openingA','阀门开度','%',0,100,1,id==='valve_b'?55:80,1),field(id==='valve_b'?'kvB':'kvA','流量系数 Kv','m³/h',.1,200,.5,16,2)];
        if(node.kind==='pipe')return [field(id==='pipe_b'?'lengthB':'lengthA','管道长度','m',.1,1000,.5,id==='pipe_b'?40:30,1),field(id==='pipe_b'?'diameterB':'diameterA','内径','mm',5,1000,1,40,1)];
        if(node.kind==='tank')return [field('level','初始液位','m',.01,10,.1,2,2),field('temperature','水温','°C',1,90,.5,20,1)];
        if(node.kind==='exchanger')return [field('ua','传热系数 UA','W/K',1,50000,100,2000,0),field('loss','局部阻力系数','-',0,1000,.5,5,1)];
        return [field(id==='sink'?'sinkPressure':'pressure','绝对压力','kPa',110,1000,1,201.325,3),field(id==='sink'?'sinkTemperature':'temperature','温度','°C',1,90,.5,20,1)];
      }
      function ensureValues(node){for(const field of fields(node)){if(!(field.key in state.runtime))state.runtime[field.key]=field.value;if(!(field.key in state.library))state.library[field.key]=field.value;}}
      function models(node){return node.kind==='pump'?['标准离心泵','高效变频泵']:node.kind==='valve'?['调节阀 Kv16','调节阀 Kv25']:node.kind==='pipe'?['DN40 标准管','DN50 标准管']:node.kind==='source'?['恒压水源','温水边界']:node.kind==='tank'?['开式水箱 2 m³','开式水箱 5 m³']:['双侧换热机组','高传热机组'];}
      function fmt(value,digits=2){return finite(value,0).toFixed(digits);}
      function reading(node){if(node.extra)return 0;if(['valve_a','pipe_a'].includes(node.id))return state.readings.qa;if(['valve_b','pipe_b'].includes(node.id))return state.readings.qb;return state.readings.q;}
      function measurements(node){const q=reading(node),p=state.runtime.pressure;return [
        ['质量流量',fmt(q,3),'kg/s'],
        ['入口压力',fmt(node.kind==='pump'?p:p+((node.id==='valve_a'||node.id==='valve_b')?145:40),2),'kPa'],
        ['出口压力',fmt(node.kind==='pump'?p+155*state.runtime.speed:p,2),'kPa'],
        ['流体温度',fmt(state.runtime.temperature+.1,1),'°C']
      ];}
      function markDirty(){state.dirty=true;root.querySelector('#fn-unsaved').textContent=' · 未保存';}
      function createNodes(){
        for(const node of nodes.values()){
          if(nodeLayer.querySelector(`[data-node="${node.id}"]`))continue;
          ensureValues(node);
          const b=document.createElement('button');b.type='button';b.className=`fn-device fn-type-${node.kind} cursor-interaction`;b.dataset.node=node.id;b.setAttribute('aria-label',`${node.name} ${node.code}，双击打开独立属性窗口`);b.setAttribute('aria-pressed',String(node.id===state.selected));
          b.innerHTML=`<span class="fn-device-flow">${fmt(reading(node),3)}</span><span class="fn-symbol">${icon(kinds[node.kind].icon)}<span class="fn-port left"></span><span class="fn-port right"></span></span><span class="fn-device-code">${node.code}</span><span class="fn-device-name">${esc(node.name)}</span>`;
          b.addEventListener('click',()=>{if(b.dataset.dragged==='yes'){b.dataset.dragged='';return;}selectNode(node.id);if(small())openWindow(node.id);});
          b.addEventListener('dblclick',()=>openWindow(node.id));
          b.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();openWindow(node.id);}if(event.key==='Delete'&&node.extra){event.preventDefault();removeExtra(node.id);}});
          b.addEventListener('contextmenu',event=>{event.preventDefault();selectNode(node.id);showContext(node.id,event.clientX,event.clientY);});
          b.addEventListener('pointerdown',event=>startNodeMove(event,node.id));
          nodeLayer.append(b);
        }
        icons();selectNode(state.selected,false);drawGraph();
      }
      function selectNode(id,closeContext=true){if(!nodes.has(id))return;state.selected=id;nodeLayer.querySelectorAll('[data-node]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.node===id)));if(closeContext)context.hidden=true;drawOpener();}
      function nodeLocations(){
        const w=canvas.clientWidth,h=canvas.clientHeight;
        let pos;
        if(w<540){const left=38,right=Math.max(145,w-91),mid=(left+right)/2;pos={source:[left,64],pump:[right,64],valve_a:[left,190],pipe_a:[left,291],valve_b:[right,190],pipe_b:[right,291],sink:[mid,402]};}
        else {const left=41,span=w-145;const x=n=>left+span*n;pos={source:[x(.035),158],pump:[x(.23),158],valve_a:[x(.545),91],pipe_a:[x(.755),91],valve_b:[x(.545),230],pipe_b:[x(.755),230],sink:[x(.96),158]};}
        for(const node of nodes.values()){
          const custom=state.positions[node.id];
          if(custom)pos[node.id]=[clamp(custom.x*w,35,w-40),clamp(custom.y*h,55,h-57)];
          else if(node.extra)pos[node.id]=[w*.48,h*.55];
        }
        return pos;
      }
      function addSvg(svg,name,attrs,text){const el=document.createElementNS(svgNS,name);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);if(text!==undefined)el.textContent=text;svg.append(el);return el;}
      function drawGraph(){
        if(!canvas.clientWidth)return;
        const points=nodeLocations();
        for(const [id,p] of Object.entries(points)){const el=nodeLayer.querySelector(`[data-node="${id}"]`);if(el){el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.querySelector('.fn-device-flow').hidden=!design.showValues;}}
        const svg=root.querySelector('.fn-network'),w=canvas.clientWidth,h=canvas.clientHeight,box=canvas.getBoundingClientRect();svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
        const port=(id,side)=>{const p=nodeLayer.querySelector(`[data-node="${id}"] .fn-symbol`).getBoundingClientRect();return {x:(side==='left'?p.left:p.right)-box.left,y:p.top+p.height/2-box.top};};
        const drawLine=pts=>addSvg(svg,'polyline',{points:pts.map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:'var(--fn-pipe)','stroke-width':2,'stroke-linejoin':'round'});
        const joint=p=>addSvg(svg,'circle',{cx:p.x,cy:p.y,r:3.5,fill:'var(--fn-pipe)'});
        const line=(a,b,vertical=false)=>{const mid=vertical?(a.y+b.y)/2:(a.x+b.x)/2;drawLine(vertical?[a,{x:a.x,y:mid},{x:b.x,y:mid},b]:[a,{x:mid,y:a.y},{x:mid,y:b.y},b]);};
        line(port('source','right'),port('pump','left'));
        if(w>=540){
          const p=port('pump','right'),a=port('valve_a','left'),b=port('valve_b','left'),join={x:(p.x+Math.min(a.x,b.x))/2,y:p.y};
          line(p,join);drawLine([join,{x:join.x,y:a.y},a]);drawLine([join,{x:join.x,y:b.y},b]);joint(join);
          line(port('valve_a','right'),port('pipe_a','left'));line(port('valve_b','right'),port('pipe_b','left'));
          const ap=port('pipe_a','right'),bp=port('pipe_b','right'),sink=port('sink','left'),merge={x:(Math.max(ap.x,bp.x)+sink.x)/2,y:sink.y};drawLine([ap,{x:merge.x,y:ap.y},merge]);drawLine([bp,{x:merge.x,y:bp.y},merge]);line(merge,sink);joint(merge);
        } else {
          const p=port('pump','right'),a=port('valve_a','left'),b=port('valve_b','left');const y=125;
          drawLine([p,{x:p.x+10,y},{x:Math.max(16,a.x-11),y},{x:Math.max(16,a.x-11),y:a.y},a]);
          drawLine([{x:b.x-12,y},{x:b.x-12,y:b.y},b]);joint({x:b.x-12,y});
          line(port('valve_a','right'),port('pipe_a','right'),true);line(port('valve_b','right'),port('pipe_b','right'),true);
          const ap=port('pipe_a','left'),bp=port('pipe_b','left'),sink=port('sink','left'),ax=Math.max(8,ap.x-8),bx=Math.max(8,bp.x-8);drawLine([ap,{x:ax,y:ap.y},{x:ax,y:349},{x:sink.x-14,y:349},{x:sink.x-14,y:sink.y},sink]);drawLine([bp,{x:bx,y:bp.y},{x:bx,y:349},{x:sink.x-14,y:349}]);joint({x:sink.x-14,y:349});
        }
        drawOpener();
      }
      function drawOpener(){const opener=root.querySelector('.fn-device-opener');const el=nodeLayer.querySelector(`[data-node="${state.selected}"]`);if(!el||small()){opener.hidden=true;return;}opener.hidden=false;opener.style.left=el.style.left;opener.style.top=(parseFloat(el.style.top)+62)+'px';}
      function windowDefaults(id){const w=desktop.clientWidth;return {open:true,minimized:false,pinned:false,tab:'parameters',model:0,x:id==='pump'?w*.18:id==='valve_a'?w*.56:w*.42,y:id==='pump'?320:id==='valve_a'?341:120,width:id==='curves'?424:350,height:0};}
      function windowTitle(id){return id==='curves'?'趋势曲线 · 主系统':`${nodes.get(id).name} · ${nodes.get(id).code}`;}
      function windowHeader(id){const isCurve=id==='curves';return `<div class="fn-window-header"><button type="button" class="fn-drag-title" data-move="${id}" aria-label="移动${esc(windowTitle(id))}窗口；也可使用方向键">${icon(isCurve?'chart-no-axes-combined':kinds[nodes.get(id).kind].icon)}<span id="fn-window-title-${id}">${esc(windowTitle(id))}</span></button><div class="fn-window-tools"><button type="button" class="cursor-interaction" data-w-action="pin" aria-label="置顶${esc(windowTitle(id))}" aria-pressed="false">${icon('pin')}</button><button type="button" class="cursor-interaction" data-w-action="minimize" aria-label="收起${esc(windowTitle(id))}">${icon('minus')}</button><button type="button" class="cursor-interaction" data-w-action="close" aria-label="关闭${esc(windowTitle(id))}">${icon('x')}</button></div></div>`;}
      function makeWindow(id){
        if(panels.has(id))return panels.get(id);
        const el=document.createElement('section');el.className='fn-window';el.dataset.window=id;el.setAttribute('role','dialog');el.setAttribute('aria-modal','false');el.setAttribute('aria-labelledby','fn-window-title-'+id);
        let body='';
        if(id==='curves'){
          body=`<div class="fn-window-body"><div class="fn-curve-header"><span>质量流量</span><span class="fn-curve-tag">示例趋势 · kg/s</span></div><svg class="fn-chart" role="img" aria-label="主管及两条支路质量流量示例曲线，不代表真实求解结果"></svg><div class="fn-chart-legend"><button type="button" class="fn-legend-button cursor-interaction" data-series="total" aria-pressed="true"><span class="fn-line-key"></span>主管</button><button type="button" class="fn-legend-button cursor-interaction" data-series="a" aria-pressed="true"><span class="fn-line-key a"></span>A 路</button><button type="button" class="fn-legend-button cursor-interaction" data-series="b" aria-pressed="true"><span class="fn-line-key b"></span>B 路</button></div><div class="fn-chart-detail"></div></div>`;

      root.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelPlacement();context.hidden=true;}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();root.querySelector('[data-action="save"]').click();}});
      function scheduleLayout(){if(scheduled)return;scheduled=requestAnimationFrame(()=>{scheduled=0;root.style.setProperty('--fn-library-width',design.libraryWidth+'px');root.style.setProperty('--fn-row-height',design.compact?'36px':'44px');drawGraph();for(const id of panels.keys())positionWindow(id);drawChart();});}
      function restore(saved){if(!saved||saved.version!==2)return false;state.time=clamp(finite(saved.time,12),0,600);for(const [key,value] of Object.entries(saved.runtime||{}))if(Number.isFinite(value)&&/^[A-Za-z0-9_]+$/.test(key))state.runtime[key]=value;for(const [key,value] of Object.entries(saved.library||{}))if((Number.isFinite(value)||value==='')&&/^[A-Za-z0-9_]+$/.test(key))state.library[key]=value;
        for(const item of (saved.extras||[]).slice(0,12)){if(!kinds[item.kind]||!/^extra_[a-z]+_[0-9]+$/.test(item.id))continue;const node={id:item.id,kind:item.kind,code:kinds[item.kind].code+'-'+item.id.split('_').at(-1),name:kinds[item.kind].name,extra:true};state.extras.push(node);nodes.set(node.id,node);}
        for(const [id,pos] of Object.entries(saved.positions||{}))if(nodes.has(id)&&Number.isFinite(pos.x)&&Number.isFinite(pos.y))state.positions[id]={x:clamp(pos.x,0,1),y:clamp(pos.y,0,1)};
        for(const [id,win] of Object.entries(saved.windows||{})){if(id!=='curves'&&!nodes.has(id))continue;state.windows[id]={...windowDefaults(id),open:!!win.open,minimized:!!win.minimized,pinned:!!win.pinned,tab:win.tab==='variables'?'variables':'parameters',model:win.model===1?1:0,x:finite(win.x,180),y:finite(win.y,320),width:finite(win.width,350)};}
        state.order=(saved.order||[]).filter(id=>id==='curves'||nodes.has(id));state.selected=nodes.has(saved.selected)?saved.selected:'pump';state.libraryCollapsed=!!saved.libraryCollapsed;root.classList.toggle('library-collapsed',state.libraryCollapsed);if(saved.readings&&['q','qa','qb'].every(k=>Number.isFinite(saved.readings[k])))state.readings={...saved.readings};if(Array.isArray(saved.history)&&saved.history.length>1&&saved.history.every(row=>['t','q','qa','qb'].every(k=>Number.isFinite(row[k]))))state.history=saved.history.slice(-70);for(const key of ['total','a','b'])if(typeof saved.series?.[key]==='boolean')state.series[key]=saved.series[key];design.libraryWidth=clamp(finite(saved.design?.libraryWidth,144),124,184);if(typeof saved.design?.compact==='boolean')design.compact=saved.design.compact;if(typeof saved.design?.showValues==='boolean')design.showValues=saved.design.showValues;return true;
      }
      const restored=restore(window.openai?.widgetState?.privateContent);
      createNodes();
      if(!restored){state.windows.pump=windowDefaults('pump');state.windows.valve_a=windowDefaults('valve_a');state.order=['pump','valve_a'];}
      for(const id of [...state.order]){if(!state.windows[id]?.open)continue;makeWindow(id);positionWindow(id);setWindowTab(id,state.windows[id].tab,false);const el=panels.get(id);if(id!=='curves')el.querySelector('[data-model]').value=String(state.windows[id].model);}
      if(state.order.length)raiseWindow(state.order.at(-1),false);updateValues();icons();scheduleLayout();
      new ResizeObserver(scheduleLayout).observe(root);new ResizeObserver(scheduleLayout).observe(canvas);
      window.addEventListener('pagehide',()=>{clearInterval(timer);clearTimeout(toastTimer);});
      window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(!incoming||incoming.version!==2||pointer||state.running||root.contains(document.activeElement))return;for(const el of panels.values())el.hidden=true;state.extras=[];restore(incoming);createNodes();for(const id of state.order){if(!state.windows[id]?.open)continue;makeWindow(id);positionWindow(id);setWindowTab(id,state.windows[id].tab,false);}updateValues();updateSwitcher();scheduleLayout();});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{scheduleLayout();persist();}});tweak.addSlider(design,'libraryWidth',{label:'模块库宽度',min:124,max:184,step:4,unit:'px',reference:'--fn-library-width'});tweak.addToggle(design,'compact',{label:'紧凑参数表'});tweak.addToggle(design,'showValues',{label:'画布显示设备流量'});}
    })();
  </script>
