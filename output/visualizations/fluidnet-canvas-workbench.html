<div id="fluidnet-canvas-workbench" aria-label="FluidNet 大画布工作台原型">
  <style>
    #fluidnet-canvas-workbench {
      --fc-paper:light-dark(#ffffff,#171c22);--fc-panel:light-dark(#f6f7f8,#21272e);--fc-raised:light-dark(#ffffff,#272e36);
      --fc-text:light-dark(#303a45,#e3e8ef);--fc-muted:light-dark(#6d7681,#a0abb8);--fc-border:light-dark(#dde1e6,#39434e);
      --fc-accent:light-dark(#ec841c,#ffab52);--fc-accent-ink:light-dark(#a65b0a,#ffc17e);--fc-soft:light-dark(#fff2e3,#423122);
      --fc-line:light-dark(#f48b24,#f6a04b);--fc-blue:light-dark(#367baf,#83bdeb);--fc-green:light-dark(#22815e,#6fcea6);
      --fc-danger:light-dark(#bc4050,#ff98a6);--fc-rail:light-dark(#252c32,#11161c);--fc-rail-text:light-dark(#cbd1d8,#b4beca);
      --fc-shadow:light-dark(#20283024,#00000065);--fc-water:light-dark(#dbeff7,#244a5c);--fc-grid:light-dark(#e7ebf0,#303a44);
      --fc-library-width:156px;--fc-symbol-size:29px;font:12px/1.45 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--fc-text);width:100%;
    }
    #fluidnet-canvas-workbench * {box-sizing:border-box;}
    #fluidnet-canvas-workbench [hidden] {display:none!important;}
    #fluidnet-canvas-workbench button,#fluidnet-canvas-workbench input,#fluidnet-canvas-workbench select,#fluidnet-canvas-workbench textarea {font:inherit;color:inherit;}
    #fluidnet-canvas-workbench button {touch-action:manipulation;}
    #fluidnet-canvas-workbench button:disabled {opacity:.36;cursor:default;}
    #fluidnet-canvas-workbench svg[data-lucide] {width:16px;height:16px;flex:none;}
    #fluidnet-canvas-workbench .fc-shell {display:grid;grid-template-columns:48px var(--fc-library-width) minmax(0,1fr);background:var(--fc-paper);border:1px solid var(--fc-border);border-radius:9px;overflow:hidden;position:relative;}
    #fluidnet-canvas-workbench .fc-rail {grid-row:1/3;background:var(--fc-rail);color:var(--fc-rail-text);display:flex;align-items:center;flex-direction:column;gap:8px;padding:13px 4px 9px;}
    #fluidnet-canvas-workbench .fc-logo {height:32px;width:32px;border:1px solid var(--fc-accent);border-radius:50%;display:grid;place-items:center;color:var(--fc-accent);margin-bottom:12px;}
    #fluidnet-canvas-workbench .fc-logo svg[data-lucide] {height:21px;width:21px;}
    #fluidnet-canvas-workbench .fc-rail-button {border:0;background:transparent;color:inherit;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:5px;border-radius:5px;min-height:49px;width:39px;padding:6px 2px;font-size:11px;}
    #fluidnet-canvas-workbench .fc-rail-button:hover,#fluidnet-canvas-workbench .fc-rail-button[aria-pressed="true"] {background:#ffffff0d;color:var(--fc-accent);}
    #fluidnet-canvas-workbench .fc-rail-spacer {flex:1;min-height:50px;}
    #fluidnet-canvas-workbench .fc-rail-mark {font-size:11px;color:var(--fc-rail-text);opacity:.7;writing-mode:vertical-rl;letter-spacing:2px;}
    #fluidnet-canvas-workbench .fc-library {grid-column:2;grid-row:1;background:var(--fc-panel);border-right:1px solid var(--fc-border);display:flex;flex-direction:column;min-width:0;}
    #fluidnet-canvas-workbench .fc-library-heading {display:flex;align-items:center;justify-content:space-between;min-height:43px;padding:0 12px;border-bottom:1px solid var(--fc-border);font-weight:500;}
    #fluidnet-canvas-workbench .fc-count {color:var(--fc-muted);font-size:11px;font-variant-numeric:tabular-nums;}
    #fluidnet-canvas-workbench .fc-library-groups {padding:4px 6px 8px;}
    #fluidnet-canvas-workbench .fc-group-heading {display:flex;align-items:center;gap:5px;width:100%;padding:9px 5px 5px;color:var(--fc-accent-ink);font-size:11px;font-weight:500;border:0;background:transparent;text-align:left;}
    #fluidnet-canvas-workbench .fc-group-heading svg[data-lucide] {width:11px;height:11px;}
    #fluidnet-canvas-workbench .fc-group-heading[aria-expanded="false"] svg {transform:rotate(-90deg);}
    #fluidnet-canvas-workbench .fc-item {display:flex;align-items:center;gap:7px;width:100%;min-height:27px;padding:3px 6px;margin-bottom:2px;border:1px solid transparent;border-radius:3px;background:light-dark(#eceef0,#2b333d);text-align:left;}
    #fluidnet-canvas-workbench .fc-item svg[data-lucide] {width:13px;height:13px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-item:hover,#fluidnet-canvas-workbench .fc-item[aria-pressed="true"] {background:var(--fc-soft);border-color:var(--fc-accent);}
    #fluidnet-canvas-workbench .fc-item-code {margin-left:auto;font-size:11px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-properties {margin-top:auto;border-top:1px solid var(--fc-border);padding:8px 10px 10px;min-height:155px;}
    #fluidnet-canvas-workbench .fc-property-heading {display:flex;align-items:center;justify-content:space-between;font-weight:500;margin-bottom:8px;}
    #fluidnet-canvas-workbench .fc-property-heading span:last-child {font-size:11px;color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-property-grid {display:grid;grid-template-columns:48px minmax(0,1fr);gap:5px;font-size:11px;margin:0;}
    #fluidnet-canvas-workbench .fc-property-grid dt {color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-property-grid dd {margin:0;overflow-wrap:anywhere;}
    #fluidnet-canvas-workbench .fc-property-actions {display:flex;gap:5px;margin-top:10px;}
    #fluidnet-canvas-workbench .fc-button {display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:28px;padding:4px 8px;border:1px solid var(--fc-border);border-radius:4px;background:var(--fc-raised);font-size:11px;}
    #fluidnet-canvas-workbench .fc-button:hover:not(:disabled) {border-color:var(--fc-accent);color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-button.primary {color:var(--fc-paper);background:var(--fc-text);border-color:var(--fc-text);}
    #fluidnet-canvas-workbench .fc-button svg[data-lucide] {width:13px;height:13px;}
    #fluidnet-canvas-workbench .fc-main {grid-column:3;grid-row:1;min-width:0;display:flex;flex-direction:column;}
    #fluidnet-canvas-workbench .fc-titlebar {display:flex;align-items:center;gap:12px;min-height:43px;padding:8px 101px 8px 16px;background:var(--fc-paper);border-bottom:1px solid var(--fc-border);flex-wrap:wrap;}
    #fluidnet-canvas-workbench .fc-app-name {font-weight:500;letter-spacing:.2px;white-space:nowrap;}
    #fluidnet-canvas-workbench .fc-title-divider {height:12px;width:1px;background:var(--fc-border);}
    #fluidnet-canvas-workbench .fc-project-title {font-size:11px;color:var(--fc-muted);display:flex;align-items:center;gap:6px;}
    #fluidnet-canvas-workbench .fc-unsaved-dot {width:5px;height:5px;border-radius:50%;background:var(--fc-accent);}
    #fluidnet-canvas-workbench .fc-topbar {display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-height:37px;background:var(--fc-panel);border-bottom:1px solid var(--fc-border);padding:0 10px 0 6px;}
    #fluidnet-canvas-workbench .fc-tabs {display:flex;align-items:center;gap:1px;flex-wrap:wrap;}
    #fluidnet-canvas-workbench .fc-tab {border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 10px 7px;font-size:11px;min-height:36px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-tab[aria-selected="true"] {color:var(--fc-accent-ink);background:var(--fc-paper);border-bottom-color:var(--fc-accent);}
    #fluidnet-canvas-workbench .fc-icon-button {border:0;background:transparent;display:inline-grid;place-items:center;border-radius:3px;min-width:27px;min-height:27px;padding:4px;}
    #fluidnet-canvas-workbench .fc-icon-button:hover:not(:disabled),#fluidnet-canvas-workbench .fc-icon-button[aria-pressed="true"] {background:var(--fc-soft);color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-tools {display:flex;align-items:center;gap:3px;}
    #fluidnet-canvas-workbench .fc-tool-separator {height:12px;width:1px;margin:0 5px;background:var(--fc-border);}
    #fluidnet-canvas-workbench .fc-medium {font-size:11px;color:var(--fc-muted);margin-left:3px;white-space:nowrap;}
    #fluidnet-canvas-workbench .fc-medium-dot {display:inline-block;width:6px;height:6px;background:var(--fc-accent);border-radius:50%;margin-right:5px;}
    #fluidnet-canvas-workbench .fc-desktop {position:relative;flex:1;min-height:600px;background:var(--fc-paper);}
    #fluidnet-canvas-workbench .fc-canvas {position:absolute;inset:0 56px 0 0;touch-action:none;overflow:hidden;}
    #fluidnet-canvas-workbench.is-grid .fc-canvas {background-image:radial-gradient(var(--fc-grid) .8px,transparent .8px);background-size:18px 18px;}
    #fluidnet-canvas-workbench .fc-canvas.is-placing,#fluidnet-canvas-workbench .fc-canvas.is-connecting {cursor:crosshair;}
    #fluidnet-canvas-workbench .fc-network {position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
    #fluidnet-canvas-workbench .fc-edge {fill:none;stroke:var(--fc-line);stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;}
    #fluidnet-canvas-workbench .fc-edge.is-selected {stroke-width:3;}
    #fluidnet-canvas-workbench .fc-edge-hit {fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:crosshair;}
    #fluidnet-canvas-workbench .fc-edge-preview {fill:none;stroke:var(--fc-accent);stroke-width:1.5;stroke-dasharray:4 4;}
    #fluidnet-canvas-workbench .fc-node {position:absolute;width:44px;height:40px;transform:translate(-50%,-50%);touch-action:none;}
    #fluidnet-canvas-workbench .fc-node-body {width:44px;height:40px;background:transparent;border:1px solid transparent;border-radius:5px;padding:4px;display:grid;place-items:center;position:relative;touch-action:none;}
    #fluidnet-canvas-workbench .fc-node-body:hover {background:var(--fc-soft);}
    #fluidnet-canvas-workbench .fc-node-body[aria-pressed="true"] {border-color:var(--fc-accent);background:var(--fc-soft);}
    #fluidnet-canvas-workbench .fc-node-symbol {position:relative;display:grid;place-items:center;width:var(--fc-symbol-size);height:var(--fc-symbol-size);color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-node-symbol svg[data-lucide] {width:calc(var(--fc-symbol-size) - 5px);height:calc(var(--fc-symbol-size) - 5px);stroke-width:1.45;}
    #fluidnet-canvas-workbench .fc-kind-pump .fc-node-symbol {border:1px solid var(--fc-muted);border-radius:50%;background:var(--fc-panel);}
    #fluidnet-canvas-workbench .fc-kind-pump .fc-node-symbol:after {content:"";position:absolute;width:17px;border-top:2px solid var(--fc-muted);bottom:-4px;}
    #fluidnet-canvas-workbench .fc-kind-source .fc-node-symbol,#fluidnet-canvas-workbench .fc-kind-tank .fc-node-symbol {background:linear-gradient(to top,var(--fc-water) 45%,var(--fc-paper) 45%);border:1px solid var(--fc-blue);border-radius:50%;color:var(--fc-blue);overflow:hidden;}
    #fluidnet-canvas-workbench .fc-kind-source .fc-node-symbol svg {width:20px;height:20px;}
    #fluidnet-canvas-workbench .fc-kind-valve .fc-node-symbol,#fluidnet-canvas-workbench .fc-kind-check .fc-node-symbol {color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-kind-pipe .fc-node-symbol {width:30px;height:10px;border:1px solid var(--fc-accent);background:var(--fc-paper);border-radius:1px;color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-kind-pipe .fc-node-symbol svg {height:13px;width:18px;}
    #fluidnet-canvas-workbench .fc-kind-junction .fc-node-symbol {width:9px;height:9px;border-radius:50%;background:var(--fc-line);}
    #fluidnet-canvas-workbench .fc-kind-junction .fc-node-symbol svg {display:none;}
    #fluidnet-canvas-workbench .fc-node-code {position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:11px;line-height:1.25;white-space:nowrap;color:var(--fc-text);pointer-events:none;}
    #fluidnet-canvas-workbench .fc-node-name {display:block;color:var(--fc-muted);font-size:11px;line-height:1.4;margin-top:2px;}
    #fluidnet-canvas-workbench:not(.is-names) .fc-node-name {display:none;}
    #fluidnet-canvas-workbench .fc-node-value {position:absolute;bottom:43px;left:50%;transform:translateX(-50%);color:var(--fc-accent-ink);font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;pointer-events:none;}
    #fluidnet-canvas-workbench .fc-port {position:absolute;top:10px;left:-12px;width:22px;height:22px;background:transparent;border:0;padding:0;display:grid;place-items:center;}
    #fluidnet-canvas-workbench .fc-port[data-side="out"] {left:auto;right:-12px;}
    #fluidnet-canvas-workbench .fc-port:after {content:"";width:5px;height:5px;border:1px solid var(--fc-line);border-radius:50%;background:var(--fc-paper);}
    #fluidnet-canvas-workbench .fc-port.is-connected:after {background:var(--fc-line);}
    #fluidnet-canvas-workbench .fc-port:hover:after,#fluidnet-canvas-workbench .fc-port.is-pending:after {width:9px;height:9px;background:var(--fc-accent);box-shadow:0 0 0 3px var(--fc-soft);}
    #fluidnet-canvas-workbench .fc-runbar {position:absolute;right:9px;top:145px;display:flex;flex-direction:column;gap:5px;padding:5px 0;z-index:20;}
    #fluidnet-canvas-workbench .fc-run-button {display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:42px;width:37px;border:1px solid var(--fc-border);background:var(--fc-raised);border-radius:4px;font-size:11px;}
    #fluidnet-canvas-workbench .fc-run-button[data-action="run"] {background:var(--fc-green);border-color:var(--fc-green);color:var(--fc-paper);}
    #fluidnet-canvas-workbench .fc-run-button[data-action="step"] {color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-run-button:hover:not(:disabled) {box-shadow:0 2px 7px var(--fc-shadow);}
    #fluidnet-canvas-workbench .fc-run-separator {height:6px;}
    #fluidnet-canvas-workbench .fc-canvas-caption {position:absolute;top:14px;left:16px;color:var(--fc-muted);font-size:11px;pointer-events:none;}
    #fluidnet-canvas-workbench .fc-canvas-caption strong {font-weight:400;color:var(--fc-text);margin-right:8px;}
    #fluidnet-canvas-workbench .fc-empty {position:absolute;left:24px;right:24px;top:43%;text-align:center;color:var(--fc-muted);pointer-events:none;}
    #fluidnet-canvas-workbench .fc-empty svg {display:block;margin:0 auto 10px;}
    #fluidnet-canvas-workbench .fc-canvas-foot {position:absolute;bottom:13px;left:16px;right:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;pointer-events:none;}
    #fluidnet-canvas-workbench .fc-hint {color:var(--fc-muted);max-width:72%;}
    #fluidnet-canvas-workbench .fc-zoom {display:flex;align-items:center;gap:3px;background:var(--fc-raised);border:1px solid var(--fc-border);border-radius:4px;padding:2px;pointer-events:auto;white-space:nowrap;}
    #fluidnet-canvas-workbench .fc-zoom span {min-width:34px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;}
    #fluidnet-canvas-workbench .fc-zoom .fc-icon-button {min-width:23px;min-height:23px;}
    #fluidnet-canvas-workbench .fc-footer {grid-column:2/4;grid-row:2;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--fc-border);min-height:29px;padding:5px 12px;background:var(--fc-panel);font-size:11px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-footer-left {display:flex;align-items:center;flex-wrap:wrap;gap:11px;}
    #fluidnet-canvas-workbench .fc-status {display:flex;align-items:center;gap:5px;color:var(--fc-text);}
    #fluidnet-canvas-workbench .fc-led {height:5px;width:5px;background:var(--fc-muted);border-radius:50%;}
    #fluidnet-canvas-workbench.is-running .fc-led {background:var(--fc-green);}
    #fluidnet-canvas-workbench .fc-clock {font-variant-numeric:tabular-nums;}
    #fluidnet-canvas-workbench .fc-window-tray {display:flex;gap:4px;flex-wrap:wrap;}
    #fluidnet-canvas-workbench .fc-window-chip {font-size:11px;border:1px solid var(--fc-border);border-radius:3px;background:var(--fc-raised);padding:1px 6px;}
    #fluidnet-canvas-workbench .fc-window-chip.is-minimized {color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-windows {position:absolute;inset:0;pointer-events:none;z-index:30;}
    #fluidnet-canvas-workbench .fc-window {position:absolute;pointer-events:auto;width:340px;max-width:calc(100% - 16px);border:1px solid var(--fc-border);border-radius:7px;background:var(--fc-raised);box-shadow:0 7px 26px var(--fc-shadow);}
    #fluidnet-canvas-workbench .fc-window-header {display:flex;align-items:center;justify-content:space-between;min-height:37px;padding:4px 5px 4px 10px;background:var(--fc-panel);border-bottom:1px solid var(--fc-border);border-radius:7px 7px 0 0;gap:4px;}
    #fluidnet-canvas-workbench .fc-window-title {display:flex;align-items:center;gap:7px;min-width:0;flex:1;background:transparent;border:0;font-weight:500;padding:3px 0;text-align:left;cursor:grab;touch-action:none;}
    #fluidnet-canvas-workbench .fc-window-title span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #fluidnet-canvas-workbench .fc-window-controls {display:flex;gap:1px;}
    #fluidnet-canvas-workbench .fc-window-controls .fc-icon-button {min-width:24px;min-height:25px;}
    #fluidnet-canvas-workbench .fc-window-controls svg[data-lucide] {width:13px;height:13px;}
    #fluidnet-canvas-workbench .fc-window-controls [data-window-action="close"]:hover {color:var(--fc-danger);}
    #fluidnet-canvas-workbench .fc-window-tabs {display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--fc-border);}
    #fluidnet-canvas-workbench .fc-window-tab {border:0;border-bottom:2px solid transparent;padding:10px 8px 8px;background:transparent;font-size:11px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-window-tab[aria-selected="true"] {border-bottom-color:var(--fc-accent);color:var(--fc-accent-ink);}
    #fluidnet-canvas-workbench .fc-window-body {padding:12px;}
    #fluidnet-canvas-workbench .fc-model {display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:11px;}
    #fluidnet-canvas-workbench .fc-model label {white-space:nowrap;color:var(--fc-muted);}
    #fluidnet-canvas-workbench select,#fluidnet-canvas-workbench input {background:var(--fc-paper);border:1px solid var(--fc-border);border-radius:3px;padding:4px 6px;min-width:0;}
    #fluidnet-canvas-workbench .fc-model select {width:100%;font-size:11px;}
    #fluidnet-canvas-workbench .fc-table {border-collapse:collapse;width:100%;font-size:11px;}
    #fluidnet-canvas-workbench .fc-table th {text-align:left;font-weight:400;color:var(--fc-muted);padding:6px 5px;border-bottom:1px solid var(--fc-border);}
    #fluidnet-canvas-workbench .fc-table td {padding:9px 5px;border-bottom:1px solid var(--fc-border);font-variant-numeric:tabular-nums;}
    #fluidnet-canvas-workbench .fc-table th:nth-child(n+2),#fluidnet-canvas-workbench .fc-table td:nth-child(n+2) {text-align:right;}
    #fluidnet-canvas-workbench .fc-table input {width:74px;text-align:right;font-size:11px;}
    #fluidnet-canvas-workbench .fc-unit {color:var(--fc-muted);margin-left:3px;font-size:11px;}
    #fluidnet-canvas-workbench .fc-feedback {font-size:11px;color:var(--fc-muted);margin:10px 0;min-height:16px;}
    #fluidnet-canvas-workbench .fc-feedback.is-error {color:var(--fc-danger);}
    #fluidnet-canvas-workbench .fc-window-actions {display:flex;align-items:center;justify-content:flex-end;gap:7px;}
    #fluidnet-canvas-workbench .fc-window-actions [data-measure-time] {margin-right:auto;font-size:11px;color:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-chart-title {display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--fc-muted);margin-bottom:5px;}
    #fluidnet-canvas-workbench .fc-chart {width:100%;height:190px;display:block;}
    #fluidnet-canvas-workbench .fc-chart text {font:11px "Segoe UI","Microsoft YaHei",sans-serif;fill:var(--fc-muted);}
    #fluidnet-canvas-workbench .fc-chart-legend {display:flex;gap:13px;flex-wrap:wrap;margin:3px 0 8px;}
    #fluidnet-canvas-workbench .fc-series {display:flex;align-items:center;gap:5px;border:0;background:transparent;padding:3px 0;font-size:11px;}
    #fluidnet-canvas-workbench .fc-series[aria-pressed="false"] {opacity:.4;}
    #fluidnet-canvas-workbench .fc-series-key {display:block;width:15px;border-top:2px solid var(--fc-blue);}
    #fluidnet-canvas-workbench .fc-series[data-series="a"] .fc-series-key {border-top-color:var(--fc-line);}
    #fluidnet-canvas-workbench .fc-series[data-series="b"] .fc-series-key {border-top-color:var(--fc-green);border-top-style:dashed;}
    #fluidnet-canvas-workbench .fc-chart-detail {min-height:30px;font-size:11px;color:var(--fc-muted);font-variant-numeric:tabular-nums;}
    #fluidnet-canvas-workbench .fc-toast {position:absolute;left:50%;top:48px;transform:translateX(-50%);max-width:calc(100% - 25px);padding:8px 13px;border:1px solid var(--fc-border);background:var(--fc-raised);box-shadow:0 3px 14px var(--fc-shadow);border-radius:5px;font-size:11px;z-index:900;pointer-events:none;}
    #fluidnet-canvas-workbench .fc-popover {position:absolute;top:80px;left:55px;z-index:800;width:215px;max-width:calc(100% - 70px);padding:12px;background:var(--fc-raised);border:1px solid var(--fc-border);border-radius:6px;box-shadow:0 5px 20px var(--fc-shadow);}
    #fluidnet-canvas-workbench .fc-popover-heading {display:flex;align-items:center;justify-content:space-between;font-weight:500;margin-bottom:9px;}
    #fluidnet-canvas-workbench .fc-project-link {display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;padding:8px 5px;background:transparent;border-radius:3px;font-size:11px;}

  <script>
